<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SKYFALL</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif;touch-action:none}#game{display:block;width:100%;height:100%;background:linear-gradient(#081a2d,#07101b)}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:white;font-weight:bold;font-size:18px;text-shadow:0 2px 4px #000;pointer-events:none}#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:white;text-align:center;font-size:30px;font-weight:bold;pointer-events:none}#controls{position:fixed;inset:0;pointer-events:none}#stick{position:absolute;left:22px;bottom:24px;width:130px;height:130px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff10;pointer-events:auto}#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#ffffff66}#fire{position:absolute;right:25px;bottom:35px;width:105px;height:105px;border-radius:50%;border:2px solid #fff8;background:#ff315555;color:white;font-weight:bold;font-size:18px;pointer-events:auto}#restart{display:none;position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);padding:14px 28px;border:0;border-radius:12px;background:#fff;color:#111;font-weight:bold;font-size:18px}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="score">Score: 0</span><span id="hp">HP: 100</span></div><div id="startScreen" style="position:fixed;inset:0;background:#050b14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10"><div style="font-size:58px;font-weight:900;letter-spacing:8px;color:white;text-shadow:0 0 18px #37d7ff">SKYFALL</div><div style="margin-top:8px;color:#8deaff;letter-spacing:5px;font-size:14px">SHOOTING GAME</div><button id="startBtn" style="margin-top:24px;padding:14px 34px;border:0;border-radius:12px;font-size:20px;font-weight:bold;background:white;color:#111">START GAME</button></div><div id="msg"></div><button id="restart">RESTART</button><div id="controls"><div id="stick"><div id="knob"></div></div><button id="fire">FIRE</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let W,H,dpr,score=0,hp=100,over=false,last=0,spawn=0,fire=false,keys={};const p={x:0,y:0,r:18,s:260,cd:0};let enemies=[],bullets=[],joy={x:0,y:0},joyActive=false;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!p.x){p.x=W/2;p.y=H/2}}addEventListener('resize',resize);resize();function shoot(){if(over||p.cd>0)return;p.cd=.16;const a=Math.atan2(H/2-p.y,W/2-p.x);bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*620,vy:Math.sin(a)*620,r:5})}function spawnEnemy(){const side=Math.floor(Math.random()*4),m=30;let ex=side==0?-m:side==1?W+m:Math.random()*W;let ey=side==2?-m:side==3?H+m:Math.random()*H;enemies.push({x:ex,y:ey,r:17,h:1,s:70+Math.random()*45})}function loop(t){const dt=Math.min((t-last)/1000,.033);last=t;if(!over){let mx=joy.x,my=joy.y;if(keys.w||keys.ArrowUp)my-=1;if(keys.s||keys.ArrowDown)my+=1;if(keys.a||keys.ArrowLeft)mx-=1;if(keys.d||keys.ArrowRight)mx+=1;const len=Math.hypot(mx,my)||1;p.x+=mx/len*p.s*dt;p.y+=my/len*p.s*dt;p.x=Math.max(20,Math.min(W-20,p.x));p.y=Math.max(45,Math.min(H-20,p.y));p.cd=Math.max(0,p.cd-dt);if(fire)shoot();spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.35,1.1-score/800)}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);for(const e of enemies){const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+p.r){hp-=25;e.x=-999;if(hp<=0){hp=0;over=true;document.getElementById('msg').textContent='GAME OVER';document.getElementById('restart').style.display='block'}}}for(const b of bullets)for(const e of enemies)if(e.x>-500&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.h=0;b.x=-999;score+=10}enemies=enemies.filter(e=>e.h);document.getElementById('score').textContent='Score: '+score;document.getElementById('hp').textContent='HP: '+hp}draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);x.strokeStyle='#ffffff12';x.lineWidth=1;for(let gx=0;gx<W;gx+=50){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=50){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}x.fillStyle='#37d7ff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(p.x-28,p.y);x.lineTo(p.x+28,p.y);x.moveTo(p.x,p.y-28);x.lineTo(p.x,p.y+28);x.stroke();x.fillStyle='#ffe16b';for(const b of bullets){x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}for(const e of enemies){x.fillStyle='#ff4668';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(e.x-5,e.y-3,3,0,7);x.arc(e.x+5,e.y-3,3,0,7);x.fill()}}const stick=document.getElementById('stick'),knob=document.getElementById('knob');function setJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy),max=45;if(l>max){dx=dx/l*max;dy=dy/l*max}joy={x:dx/max,y:dy/max};knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{joyActive=true;stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(joyActive)setJoy(e)});stick.addEventListener('pointerup',()=>{joyActive=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'});const f=document.getElementById('fire');f.addEventListener('pointerdown',()=>fire=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>f.addEventListener(ev,()=>fire=false));addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space')fire=true});addEventListener('keyup',e=>{keys[e.key]=false;if(e.code==='Space')fire=false});document.getElementById('restart').onclick=()=>{score=0;hp=100;over=false;enemies=[];bullets=[];p.x=W/2;p.y=H/2;document.getElementById('msg').textContent='';document.getElementById('restart').style.display='none'};document.getElementById('startBtn').onclick=()=>{document.getElementById('startScreen').style.display='none'};requestAnimationFrame(loop);</script></body></html>
